version: 2
# Every entry runs every day at 00:00 JST on a cron schedule; `interval: daily`
# runs on weekdays only.
#
# Which of these pull requests merge on their own, and why: the header of
# .github/workflows/dependabot-auto-merge.yml.
updates:
  # Dev dependencies of the pnpm workspace (Dependabot reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    ignore:
      # @types/node follows the Node 26 runtime in .node-version; a major jump
      # moves with the runtime by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  # Actions are SHA-pinned with a version comment (`@<sha> # vX.Y.Z`);
  # Dependabot bumps the pin and comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Asia/Tokyo"
